<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromiumNoShorts</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <img src="../icons/icon48.png" alt="Logo" class="logo-icon">
        <div>
          <h1 class="logo-text">NoShorts</h1>
          <p class="logo-tagline">Anti Doom-Scroll Shield</p>
        </div>
      </div>
      <div class="master-toggle">
        <label class="toggle-switch master">
          <input type="checkbox" id="masterToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <!-- Current Site Status -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot active"></span>
      <span class="status-text" id="statusText">Protection Active</span>
    </div>

    <!-- Platform Toggles -->
    <div class="platforms-section">
      <h3 class="section-title">Platform Controls</h3>
      
      <div class="platform-card" data-site="youtube">
        <div class="platform-info">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
            <path d="M23.5 6.2c-.3-1-1-1.8-2-2.1C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.5.6c-1 .3-1.7 1.1-2 2.1C0 8.1 0 12 0 12s0 3.9.5 5.8c.3 1 1 1.8 2 2.1 1.9.6 9.5.6 9.5.6s7.6 0 9.5-.6c1-.3 1.7-1.1 2-2.1.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8z" fill="#FF0000"/>
            <path d="M9.5 15.5l6.3-3.5-6.3-3.5v7z" fill="#FFF"/>
          </svg>
          <div class="platform-details">
            <span class="platform-name">YouTube</span>
            <span class="platform-desc">Shorts, Shelf, Sidebar</span>
          </div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" class="site-toggle" data-site="youtube" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="platform-card" data-site="instagram">
        <div class="platform-info">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#FFDC80"/>
                <stop offset="25%" stop-color="#F77737"/>
                <stop offset="50%" stop-color="#E1306C"/>
                <stop offset="75%" stop-color="#C13584"/>
                <stop offset="100%" stop-color="#833AB4"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="5" stroke="url(#igGrad)" stroke-width="2" fill="none"/>
            <circle cx="12" cy="12" r="5" stroke="url(#igGrad)" stroke-width="2" fill="none"/>
            <circle cx="17.5" cy="6.5" r="1.3" fill="url(#igGrad)"/>
          </svg>
          <div class="platform-details">
            <span class="platform-name">Instagram</span>
            <span class="platform-desc">Reels, Explore Reels</span>
          </div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" class="site-toggle" data-site="instagram" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="platform-card" data-site="tiktok">
        <div class="platform-info">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
            <path d="M19.3 5.7c-1.2-.9-2-2.3-2.1-3.9h-3.6v13.7c0 1.9-1.5 3.4-3.4 3.4-1.9 0-3.4-1.5-3.4-3.4s1.5-3.4 3.4-3.4c.4 0 .7.1 1 .2V8.6c-.3 0-.7-.1-1-.1-3.8 0-6.9 3.1-6.9 6.9s3.1 6.9 6.9 6.9 6.9-3.1 6.9-6.9V9.6c1.4 1 3.1 1.6 4.9 1.6V7.6c-1.2 0-2.3-.7-2.7-1.9z" fill="#00F2EA"/>
            <path d="M19.3 5.7c-1.2-.9-2-2.3-2.1-3.9h-3.6v13.7c0 1.9-1.5 3.4-3.4 3.4-1.9 0-3.4-1.5-3.4-3.4s1.5-3.4 3.4-3.4c.4 0 .7.1 1 .2V8.6c-.3 0-.7-.1-1-.1-3.8 0-6.9 3.1-6.9 6.9s3.1 6.9 6.9 6.9 6.9-3.1 6.9-6.9V9.6c1.4 1 3.1 1.6 4.9 1.6V7.6c-1.2 0-2.3-.7-2.7-1.9z" fill="#FF004F" opacity="0.6"/>
          </svg>
          <div class="platform-details">
            <span class="platform-name">TikTok</span>
            <span class="platform-desc">For You feed overlay</span>
          </div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" class="site-toggle" data-site="tiktok" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="platform-card" data-site="twitter">
        <div class="platform-info">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="#FFFFFF"/>
          </svg>
          <div class="platform-details">
            <span class="platform-name">X (Twitter)</span>
            <span class="platform-desc">Videos for You, Explore</span>
          </div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" class="site-toggle" data-site="twitter" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="platform-card" data-site="facebook">
        <div class="platform-info">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none">
            <path d="M24 12c0-6.627-5.373-12-12-12S0 5.373 0 12c0 5.99 4.388 10.954 10.125 11.854V15.47H7.078V12h3.047V9.356c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953h-1.513c-1.491 0-1.956.925-1.956 1.875V12h3.328l-.532 3.47h-2.796v8.385C19.612 22.954 24 17.99 24 12z" fill="#1877F2"/>
          </svg>
          <div class="platform-details">
            <span class="platform-name">Facebook</span>
            <span class="platform-desc">Reels, Watch Reels</span>
          </div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" class="site-toggle" data-site="facebook" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-number" id="totalBlocked">0</span>
        <span class="stat-label">Elements Blocked</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>v1.0.0</span>
      <span>•</span>
      <span>Made with 🛡️ for focus</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
